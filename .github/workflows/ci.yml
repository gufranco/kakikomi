---
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  KAKIKOMI_TEST_JOBS: "1"
  BATS_TEST_TIMEOUT: "600"

jobs:
  plan:
    name: choose the macOS legs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.choose.outputs.macos }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - name: Run every macOS leg except on a bot pull request
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          legs='[{"shell":"/bin/sh","toolset":"native","coverage":false},{"shell":"/bin/bash","toolset":"native","coverage":false},{"shell":"/bin/zsh","toolset":"native","coverage":false},{"shell":"/opt/homebrew/bin/bash","toolset":"homebrew","coverage":true},{"shell":"/opt/homebrew/bin/zsh","toolset":"homebrew","coverage":false},{"shell":"/bin/sh","toolset":"uutils","coverage":false}]'
          case "${EVENT}:${AUTHOR}" in
          'pull_request:dependabot[bot]' | 'pull_request:renovate[bot]')
            legs='[{"shell":"/opt/homebrew/bin/bash","toolset":"homebrew","coverage":true}]'
            ;;
          *) ;;
          esac
          echo "macos=${legs}" >> "${GITHUB_OUTPUT}"

  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo koalaman/shellcheck \
            --pattern 'shellcheck-v0.11.0.linux.x86_64.tar.xz' --output shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 --wildcards '*/shellcheck'
          sudo install -m 755 shellcheck /usr/local/bin/shellcheck
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install shfmt
        run: |
          set -euo pipefail
          gh release download v3.14.1 --repo mvdan/sh --pattern 'shfmt_v3.14.1_linux_amd64' --output shfmt
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt" | sha256sum -c -
          sudo install -m 755 shfmt /usr/local/bin/shfmt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install mandoc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mandoc
      - name: shfmt, ShellCheck and mandoc at zero findings
        run: make lint
      - name: yamllint
        run: pipx run yamllint==1.37.1 -s -c .yamllint.yml .github .yamllint.yml

  test-linux:
    name: test (linux, ${{ matrix.shell }}, ${{ matrix.toolset }})
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: dash
            toolset: native
            coverage: false
          - shell: zsh
            toolset: native
            coverage: false
          - shell: bash
            toolset: native
            coverage: true
          - shell: dash
            toolset: gnu
            coverage: false
          - shell: dash
            toolset: uutils
            coverage: false
          - shell: dash
            toolset: busybox
            coverage: false
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.toolset }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install shells and tools
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: |
          set -euo pipefail
          extra=()
          case "${TOOLSET}" in
          gnu) extra=(gnu-coreutils gawk) ;;
          uutils) extra=(rust-coreutils) ;;
          busybox) extra=(busybox) ;;
          *) ;;
          esac
          mkdir -p "${HOME}/apt-archives/partial"
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::Archives="${HOME}/apt-archives" -o APT::Sandbox::User=root \
            bats dash zsh mandoc parallel dosfstools fdisk xz-utils zstd bzip2 libarchive-tools qemu-utils \
            dmsetup mtools exfatprogs wimtools xorriso 7zip "${extra[@]}"
          sudo chown -R "$(id -u):$(id -g)" "${HOME}/apt-archives"
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        if: matrix.coverage
        with:
          bundler-cache: true
      - name: Build the ${{ matrix.toolset }} toolset
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh .github/scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" > "${RUNNER_TEMP}/toolset-path"
      - name: Show which shell runs the suites
        if: contains(matrix.shell, 'bash') || contains(matrix.shell, 'zsh')
        env:
          SHELL_UNDER_TEST: ${{ matrix.shell }}
        run: '"${SHELL_UNDER_TEST}" --version | head -n 1'
      - name: Show which tools the run uses
        run: |
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh bin/kakikomi doctor
      - name: Run the suites under ${{ matrix.shell }}
        if: ${{ !matrix.coverage }}
        env:
          KAKIKOMI_TEST_SHELLS: ${{ matrix.shell }}
        run: |
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh test/run-matrix.sh test
      - name: Run the suites under bashcov
        if: matrix.coverage
        run: |
          ruby_dir="$(dirname "$(command -v ruby)")"
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${ruby_dir}:${dirs:+${dirs}:}${PATH}" sh scripts/coverage.sh 0
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.coverage
        with:
          name: coverage-Linux
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 1

  test-macos:
    name: test (macos, ${{ matrix.shell }}, ${{ matrix.toolset }})
    needs: [plan, lint, test-linux]
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install shells and tools
        run: brew install --formula bats-core bash dash-shell zsh parallel mtools wimlib xz zstd qemu p7zip sevenzip
      - name: Install the Homebrew toolset
        if: matrix.toolset == 'homebrew'
        run: |
          brew install --formula \
            coreutils findutils gnu-sed gawk grep diffutils openssl@3 perl libarchive gzip bzip2 curl
      - name: Install the uutils toolset
        if: matrix.toolset == 'uutils'
        run: brew install --formula uutils-coreutils uutils-diffutils uutils-findutils
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        if: matrix.coverage
        with:
          bundler-cache: true
      - name: Build the ${{ matrix.toolset }} toolset
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh .github/scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" > "${RUNNER_TEMP}/toolset-path"
      - name: Show which shell runs the suites
        if: contains(matrix.shell, 'bash') || contains(matrix.shell, 'zsh')
        env:
          SHELL_UNDER_TEST: ${{ matrix.shell }}
        run: '"${SHELL_UNDER_TEST}" --version | head -n 1'
      - name: Show which tools the run uses
        run: |
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh bin/kakikomi doctor
      - name: Run the suites under ${{ matrix.shell }}
        if: ${{ !matrix.coverage }}
        env:
          KAKIKOMI_TEST_SHELLS: ${{ matrix.shell }}
        run: |
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh test/run-matrix.sh test
      - name: Run the suites under bashcov
        if: matrix.coverage
        run: |
          ruby_dir="$(dirname "$(command -v ruby)")"
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${ruby_dir}:${dirs:+${dirs}:}${PATH}" sh scripts/coverage.sh 0
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.coverage
        with:
          name: coverage-macOS
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 1

  coverage-gate:
    name: coverage gate
    needs: [test-linux, test-macos]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: results
      - name: Merge both platforms and enforce 100% line coverage
        run: >-
          python3 scripts/coverage-gate.py '/(bin/kakikomi|lib/[a-z]+\.sh)\Z' 100
          results/coverage-Linux/.resultset.json results/coverage-macOS/.resultset.json
